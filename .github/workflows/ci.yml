name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Check shared-core version
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_MERGE_SHA: ${{ github.sha }}
        run: |
          # Checkout already has the PR merge result; fetch only its exact base.
          git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
          node scripts/check-shared-core-version.cjs "$PR_BASE_SHA" "$PR_MERGE_SHA" real-debrid-jdownloader.user.js
      - name: Check syntax
        run: |
          node --check real-debrid-jdownloader.user.js
          node --check real-debrid-jdownloader-loader.example.user.js
      - run: npm test
