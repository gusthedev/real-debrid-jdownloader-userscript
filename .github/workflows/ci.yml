name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Check shared-core version
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
          fi
          # Checkout has the PR merge result or pushed tip; fetch only the exact base.
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node scripts/check-shared-core-version.cjs "$BASE_SHA" "$CANDIDATE_SHA" real-debrid-jdownloader.user.js
      - name: Check syntax
        run: |
          node --check real-debrid-jdownloader.user.js
          node --check real-debrid-jdownloader-loader.example.user.js
      - run: npm test
